spring:
  application:
    name: booking-service-test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: booking-service-test-group
      auto-offset-reset: earliest
    producer:
      bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false

logging:
  level:
    com.p2p.booking: DEBUG